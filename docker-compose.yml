services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle -d controle_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://controle:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env.docker}@database:5432/controle_financeiro?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env.docker}
      PORT: 3333
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3333:3333"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333/api}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
