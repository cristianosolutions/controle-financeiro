name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: controle_financeiro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_financeiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_financeiro_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: ./uploads-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar backend
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Validar Prisma e banco
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
      - name: Testar backend
        working-directory: backend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Instalar e compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run test:pwa
          npm run build
      - name: Validar imagens Docker
        run: |
          docker build -t control-finance-backend ./backend
          docker build --build-arg VITE_API_URL=http://localhost:3333/api -t control-finance-frontend ./frontend
